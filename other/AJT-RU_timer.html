<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apollo Justice Trilogy (Русификатор)</title>
  <link rel="icon" href="../images/AJT-RU/icon.png" type="image/png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), 
                  url('../images/AJT-RU/trial_bg2.png') center/cover no-repeat fixed #1a1a1a;
      color: #fff;
      font-family: 'Oswald', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .bg-logo {
      position: absolute;
      width: 850px;
      max-width: 95%;
      opacity: 0.12;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 20px;
      width: 100%;
    }

    .title {
      font-size: clamp(1.2rem, 3.5vw, 2rem);
      font-weight: 500;
      color: #ccc;
      margin-bottom: 25px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .digital-clock {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 15px;
      flex-wrap: nowrap;
    }

    .segment {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .number {
      font-size: clamp(4.5rem, 15vw, 10rem);
      font-weight: 700;
      line-height: 0.9;
      letter-spacing: 2px;
    }

    .dots {
      font-size: clamp(4rem, 13vw, 9rem);
      font-weight: 700;
      line-height: 0.8;
      color: rgba(255, 255, 255, 0.6);
      user-select: none;
    }

    .label {
      font-size: clamp(0.9rem, 2.5vw, 1.4rem);
      font-weight: 500;
      color: #888;
      margin-top: 15px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .back-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #000;
      color: #fff;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 0.9rem;
      border: 1px solid #fff;
      transition: background 0.2s, color 0.2s;
      z-index: 10;
      font-family: sans-serif;
    }

    .back-button:hover {
      background-color: #fff;
      color: #000;
    }
  </style>
</head>
<body>

  <img src="../images/AJT-RU/logo.png" alt="" class="bg-logo">

  <div class="container">
    <div class="title">До выхода русификатора на первое дело осталось:</div>

    <div class="digital-clock">
      <div class="segment">
        <div class="number" id="days">00</div>
        <div class="label">дней</div>
      </div>

      <div class="dots">:</div>

      <div class="segment">
        <div class="number" id="hours">00</div>
        <div class="label">часов</div>
      </div>

      <div class="dots">:</div>

      <div class="segment">
        <div class="number" id="minutes">00</div>
        <div class="label">минут</div>
      </div>

      <div class="dots">:</div>

      <div class="segment">
        <div class="number" id="seconds">00</div>
        <div class="label">секунд</div>
      </div>
    </div>
  </div>

  <a href="../index.html" class="back-button">Назад</a>

  <script>
    function update() {
      const now = new Date();
      let target = new Date(now.getFullYear(), 8, 17);

      if (now > target) {
        target = new Date(now.getFullYear() + 1, 8, 29);
      }

      const diff = target - now;
      if (diff <= 0) return;

      document.getElementById('days').textContent = String(Math.floor(diff / 86400000)).padStart(2, '0');
      document.getElementById('hours').textContent = String(Math.floor(diff / 3600000) % 24).padStart(2, '0');
      document.getElementById('minutes').textContent = String(Math.floor(diff / 60000) % 60).padStart(2, '0');
      document.getElementById('seconds').textContent = String(Math.floor(diff / 1000) % 60).padStart(2, '0');
    }

    update();
    setInterval(update, 1000);
  </script>

</body>
</html>
