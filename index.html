<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goldysw</title>
  <link rel="icon" href="images/dev_icon.jpeg" type="image/jpeg">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: #000;
      color: #fff;
      margin: 0;
      padding-top: 20px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      font-family: sans-serif;
    }
    .content { 
      flex: 1; 
    }
    .logo-container {
      display: flex;
      justify-content: center;
      margin-bottom: 15px;
    }
    .logo {
      max-width: 150px;
      height: auto;
    }
    .nav-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .nav-container a {
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
      transition: color 0.2s;
    }
    .nav-container a:hover {
      color: #fc0;
      text-decoration: underline;
    }

    .video-container {
      margin: 30px auto;
      padding: 0 20px;
      width: 100%;
      max-width: 854px;
    }
    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 8px;
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    footer {
      text-align: center;
      padding: 20px 0;
      font-size: 12px;
    }
    footer a {
      color: #888;
      text-decoration: none;
      margin: 0 10px;
    }
    footer a:hover {
      color: #ccc;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="content">
    <div class="logo-container">
      <img src="images/logo_lol.png" alt="Goldysw Logo" class="logo">
    </div>
    
    <div class="nav-container">
      <a href="game_projects/Siterung.html">Siterung</a>
      <a href="other/AJT-RU.html">Apollo Justice Trilogy (Русификатор)</a>
      <a href="game_projects/Bottomless_Gap.html">Bottomless Gap</a>
      <a href="game_projects/Toun.html">Toun</a>
    </div>

    <div class="video-container">
      <div class="video-wrapper">
        <iframe 
          src="https://www.youtube.com/embed/5rkjVgBYBWg" 
          title="Первая демонстрация перевода Apollo Justice Ace Attorney Trilogy" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
          allowfullscreen>
        </iframe>
      </div>
    </div>
  </div>

  <footer>
