<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Bottomless Gap</title>
  <link rel="icon" href="../images/BottomlessGap/icon.png" type="image/png">
  <style>
    body {
      background: #1a1a1a url('../images/BottomlessGap/bg.jpg') center/cover no-repeat;
      background-attachment: scroll;
      color: #fff;
      font-family: sans-serif;
      padding: 40px 20px;
      min-height: 100vh;
      line-height: 1.6;
      margin: 0;
    }

    .wrapper {
      max-width: 800px;
      margin: 0 auto;
    }
    .logo-container {
      text-align: center;
      margin-bottom: 30px;
    }
    .logo {
      max-width: 500px;
      width: 100%;
      height: auto;
    }
    .content-box {
      background-color: rgba(0, 0, 0, 0.75);
      padding: 30px;
      border-radius: 8px;
    }
    p {
      margin-bottom: 20px;
    }
    p:last-child {
      margin-bottom: 0;
    }
    .download-buttons {
      text-align: center;
      margin-top: 25px;
    }
    .download-buttons img {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      margin: 0 5px;
      vertical-align: middle;
      transition: opacity 0.2s;
    }
    .download-buttons a:hover img {
      opacity: 0.7;
    }
    .back-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #000;
      color: #fff;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 0.9rem;
      border: 1px solid #fff;
      transition: background 0.2s, color 0.2s;
    }
    .back-button:hover {
      background-color: #fff;
      color: #000;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="logo-container">
      <img src="../images/BottomlessGap/logo.png" alt="Bottomless Gap" class="logo">
    </div>
    <div class="content-box">
      <p>Бездна таит в себе разные тайны. Вы играете за добровольца, который решает отправиться в исследование глубокой бездны.</p>
      <p>Игра уже доступна в раннем доступе в GameJolt, itch.io и в Google Play! (на данный момент игра не поддерживается, она заморожена из-за нехватки идей, как продолжать)</p>
      <div class="download-buttons">
        <a href="https://gamejolt.com/games/bottomlessgap/771130" target="_blank"><img src="../images/download_icons/gamejolt.png" alt="GameJolt"></a>
        <a href="https://play.google.com/store/apps/details?id=com.gastudio.egoistic&hl=en_ZA" target="_blank"><img src="../images/download_icons/google_play.png" alt="Google Play"></a>
        <a href="https://goldysw.itch.io/bottomless-gap" target="_blank"><img src="../images/download_icons/itchio.png" alt="itch.io"></a>
      </div>
    </div>
  </div>
  <a href="../index.html" class="back-button">Назад</a>
</body>
</html>
