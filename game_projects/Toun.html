<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toun</title>
  <link rel="icon" href="../images/Toun/icon.png" type="image/png">
  <style>
body {
  background-image: url('../images/Toun/bg.png');
  background-size: 100% 100%;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
  background-color: #1a1a1a;
  color: #fff;
  font-family: sans-serif;
  padding: 40px 20px;
  min-height: 100vh;
  line-height: 1.6;
  margin: 0;
}

.wrapper {
  max-width: 800px;
  margin: 0 auto;
}
.logo-container {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  margin-bottom: 30px;
}
.logo {
  max-width: 1000px;
  width: 100%;
  height: auto;
  display: block;
  margin: 0 auto;
}
.back-button {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background-color: #000;
  color: #fff;
  text-decoration: none;
  padding: 10px 18px;
  border-radius: 6px;
  font-size: 0.9rem;
  border: 1px solid #fff;
  transition: background 0.2s, color 0.2s;
}
.back-button:hover {
  background-color: #fff;
  color: #000;
}
</style>
</head>
<body>
  <div class="wrapper">
    <div class="logo-container">
      <img src="../images/Toun/logo.png" alt="Toun" class="logo">
    </div>
  </div>
  <a href="../index.html" class="back-button">Назад</a>
</body>
</html>
